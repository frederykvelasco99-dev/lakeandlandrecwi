const TOWS = [
 {k:"half",en:["Full-size pickup","half ton and up"],es:["Pickup grande","media tonelada o más"],t:{en:"A full-size pickup tows everything on our lot, even the heavy-duty tandems. Confirm your rating on the door sticker.",es:"Una pickup grande jala todo lo que tenemos, hasta los doble eje reforzados. Confirma tu capacidad en la etiqueta de la puerta."}},
 {k:"mid",en:["Mid-size pickup",""],es:["Pickup mediana",""],t:{en:"Mid-size pickups tow everything on our lot. Confirm your rating on the door sticker.",es:"Las pickup medianas jalan todo lo que tenemos. Confirma tu capacidad en la etiqueta de la puerta."}},
 {k:"small",en:["Compact pickup or SUV",""],es:["Pickup compacta o SUV",""],t:{en:"Many compact pickups and SUVs are rated from about 1,500 to 4,000 lb. Compare your door sticker with the loaded weight.",es:"Muchas pickup compactas y SUV aguantan de 1,500 a 4,000 lb aprox. Compara la etiqueta de tu puerta con el peso cargado."}},
 {k:"ev",en:["Electric truck",""],es:["Camioneta eléctrica",""],t:{en:"An open aluminum trailer with the ramp folded inside costs far less range than a tall enclosed trailer. Keep it near 55 to 60 mph and check your rating.",es:"Un remolque de aluminio abierto con la rampa doblada adentro te quita mucha menos autonomía que uno cerrado y alto. Maneja a 55 o 60 mph y revisa tu capacidad."}}
];
const SIZES = {"3x5":{w:36,l:60,ax:"single",gv:800,empty:150,yard:1},"5x8":{w:60,l:96,ax:"single",gv:2200,empty:500},"5x10":{w:60,l:120,ax:"single",gv:2200,empty:550},"6.5x10":{w:78,l:120,ax:"single",gv:2990,empty:800},"6.5x12":{w:78,l:144,ax:"single",gv:2990,empty:900},"7x14":{w:82,l:168,ax:"single",gv:2990,empty:1100},"7x16":{w:82,l:192,ax:"tandem",gv:6000,empty:1400}};
// Live lot: read from the same inventory.json the main site uses.
let LOT = [];
fetch("/inventory.json", {cache:"no-store"}).then(r=>r.json()).then(d=>{
  LOT = ((d && d.units) || []).filter(u=>u.active!==false && u.status==="In Stock" && u.size).map(u=>({
    s:u.stock, z:u.size, m:(u.year?u.year+" · ":"")+u.model, p:u.priceNum||parseInt(String(u.price).replace(/[^0-9]/g,""),10)||0,
    q:(u.qty>1?u.qty:0), was:u.wasPrice?parseInt(u.wasPrice.replace(/[^0-9]/g,""),10):0, id:u.id }));
  render();
}).catch(()=>{});
let lang = "en", haul = "z60", tow = "half";
try{ const q = localStorage.getItem("fit-lang"); if(q==="es"||q==="en") lang = q; }catch(_){}
const $ = id => document.getElementById(id);
const money = n => "$" + n.toLocaleString("en-US");
function tiles(list, cur, attr){ return list.map(x=>`<button type="button" class="tile" id="${attr}-${x.k}" data-${attr}="${x.k}" aria-pressed="${x.k===cur}"><b>${x[lang][0]}</b>${x[lang][1]?`<span>${x[lang][1]}</span>`:""}</button>`).join(""); }
function render(){
  const t = T[lang]; document.documentElement.lang = lang;
  $("l-en").setAttribute("aria-pressed", lang==="en"); $("l-es").setAttribute("aria-pressed", lang==="es");
  document.querySelectorAll("[data-t]").forEach(el=>{ const v = t[el.dataset.t]; if(typeof v==="string") el.innerHTML = v; });
  document.querySelector("[data-h]").innerHTML = t.h1;
  $("haul").innerHTML = ["mow","ride","other"].map(g=>`<div class="cat">${t[g]}</div><div class="tiles">${tiles(LOADS.filter(x=>x.g===g), haul, "haul")}</div>`).join("");
  $("tow").innerHTML = tiles(TOWS, tow, "tow");
  const L = LOADS.find(x=>x.k===haul), W = TOWS.find(x=>x.k===tow), S = SIZES[L.size]; const [sw, sl] = L.size.split("x");
  $("size").textContent = `${sw} × ${sl}`;
  $("sizeSub").textContent = S.yard ? t.yard : `${S.ax==="tandem"?t.tandem:t.single} · ${t.ramp}`;
  const up = L.wUp && L.w > S.w; const fw = up ? L.wUp : L.w; const sideRoom = Math.max(0, S.w - fw), backRoom = Math.max(0, S.l - L.len);
  const snug = sideRoom < 6 || backRoom < 6; const loaded = L.wt + S.empty;
  $("facts").innerHTML = [`<span class="fact ${snug?"warn":"ok"}">${snug?t.snug:t.fits}${up?" · "+t.chute:""}</span>`, `<span class="fact n">${t.room(sideRoom.toFixed(0), backRoom.toFixed(0))}</span>`, `<span class="fact n">${t.load((Math.round(L.wt/50)*50).toLocaleString("en-US"))}</span>`].join("");
  $("why").textContent = L.why[lang];
  $("towTxt").textContent = W.t[lang] + (lang==="en" ? ` Loaded, about ${(Math.round(loaded/50)*50).toLocaleString("en-US")} lb with the trailer.` : ` Cargado, unas ${(Math.round(loaded/50)*50).toLocaleString("en-US")} lb con el remolque.`);
  // floor drawn to scale, hitch on the left
  const pad = 26, scale = (640 - pad*2 - 56) / 192; const fx = pad + 56, fh = S.w*scale, fwid = S.l*scale, fy = 16 + (82*scale - fh)/2;
  const ih = fw*scale, iw = L.len*scale, ix = fx + 6, iy = fy + (fh - ih)/2;
  $("fit").setAttribute("aria-label", `${L[lang][0]} on a ${sw} by ${sl} trailer floor, drawn to scale`);
  $("fit").innerHTML = `<line x1="${pad}" y1="${fy+fh/2}" x2="${fx}" y2="${fy+fh/2}" stroke="var(--muted)" stroke-width="3"/><circle cx="${pad}" cy="${fy+fh/2}" r="6" fill="var(--muted)"/>
    <rect x="${fx}" y="${fy}" width="${fwid}" height="${fh}" rx="3" fill="var(--floor)" stroke="var(--floor-line)" stroke-width="2"/>
    ${Array.from({length:Math.floor(S.w/6)},(_,i)=>`<line x1="${fx}" x2="${fx+fwid}" y1="${fy+(i+1)*6*scale}" y2="${fy+(i+1)*6*scale}" stroke="var(--floor-line)" stroke-width="1" opacity=".55"/>`).join("")}
    <rect x="${ix}" y="${iy}" width="${iw}" height="${ih}" rx="8" fill="var(--item-fill)" stroke="var(--item)" stroke-width="3"/>
    <text x="${ix+iw/2}" y="${iy+ih/2+6}" text-anchor="middle" font-family="IBM Plex Sans, sans-serif" font-size="15" font-weight="700" fill="var(--ink)">${L[lang][0]}</text>
    <text x="${fx+fwid/2}" y="${fy+fh+22}" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="12" fill="var(--muted)">${t.floor(S.w, S.l)} · ${lang==="en"?"drawn to scale":"dibujado a escala"}</text>`;
  const lot = LOT.filter(u=>u.z===L.size);
  $("h-haul").value = L.en[0]; $("h-tow").value = W.en[0]; $("h-rec").value = L.size; $("h-lang").value = lang;
  $("lotT").textContent = t.lotT(`${sw}×${sl}`);
  $("units").innerHTML = lot.length ? lot.map(u=>`<div class="unit"><b><a href="/#unit-${encodeURIComponent(u.id)}">${u.m}</a></b><span class="p">${money(u.p)} ${t.tax}${u.q?` · ${u.q} ${lang==="en"?"in stock":"disponibles"}`:""}</span>${u.was?`<span class="c">${t.clear(money(u.was))}</span>`:""}<span class="s">${t.stock} ${u.s}</span></div>`).join("") : `<p class="tow">${t.none}</p>`;
  $("trust").innerHTML = t.trust.map(([a,b])=>`<div><b>${a}</b><span>${b}</span></div>`).join("");
  $("faq").innerHTML = t.faq.map(([q,a])=>`<details><summary>${q}</summary><p>${a}</p></details>`).join("");
  $("privacy").innerHTML = `<h2 id="ph">${t.ptitle}</h2>${t.priv.map(([h,p])=>`<div><h3>${h}</h3><p>${p}</p></div>`).join("")}<p>${t.pupd}</p>`;
  $("legal").innerHTML = t.legal.map(x=>`<p>${x}</p>`).join("");
}
document.addEventListener("click", e=>{
  const h = e.target.closest("[data-haul]"); if(h){ haul = h.dataset.haul; render(); $("s2").scrollIntoView({behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block:"start"}); return; }
  const w = e.target.closest("[data-tow]"); if(w){ tow = w.dataset.tow; render(); $("s3").scrollIntoView({behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block:"start"}); return; }
});
$("l-en").onclick = () => { lang = "en"; try{ localStorage.setItem("fit-lang","en"); }catch(_){} render(); };
$("l-es").onclick = () => { lang = "es"; try{ localStorage.setItem("fit-lang","es"); }catch(_){} render(); };
$("lead").addEventListener("submit", e=>{ e.preventDefault(); const t = T[lang];
  const ok = $("f-name").value.trim() && $("f-phone").value.replace(/\D/g,"").length >= 10;
  if(!ok){ $("err").textContent = t.need; $("err").hidden = false; return; }
  const em = $("f-email").value.trim();
  if(em && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em)){ $("err").textContent = t.bademail; $("err").hidden = false; return; }
  $("err").hidden = true;
  const fd = new FormData($("lead")); if(!em) fd.set("emailconsent", "no"); else if(!$("f-eok").checked) fd.set("emailconsent","no");
  if(!$("f-ok").checked) fd.set("smsconsent","no");
  const btn = $("lead").querySelector(".go"); btn.disabled = true;
  fetch("/", {method:"POST", headers:{"Content-Type":"application/x-www-form-urlencoded"}, body:new URLSearchParams(fd).toString()})
    .then(r=>{ if(!r.ok) throw 0; $("formIn").hidden = true; $("done").hidden = false; })
    .catch(()=>{ btn.disabled = false; $("err").textContent = t.fail; $("err").hidden = false; });
});
render();
</script>
</body>
</html>
