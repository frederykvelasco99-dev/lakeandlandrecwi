backend:
  name: github
  repo: frederykvelasco99-dev/lakeandlandrecwi
  branch: main
 
media_folder: "photos/uploads"
public_folder: "/photos/uploads"
 
collections:
  - name: "inventory"
    label: "Inventory"
    files:
      - name: "units"
        label: "All units"
        file: "inventory.json"
        format: "json"
        fields:
          - label: "Units"
            name: "units"
            widget: "list"
            label_singular: "unit"
            collapsed: true
            summary: "{{fields.stock}}  ·  {{fields.model}}  ·  {{fields.status}}"
            fields:
              - { label: "Stock #", name: "stock", widget: "string", hint: "Type the stock number — e.g. T1756" }
              - { label: "Price", name: "price", widget: "string", required: false, hint: "e.g. $6,880" }
              - { label: "Status", name: "status", widget: "select", default: "In Stock", options: ["In Stock", "Sale Pending", "In Transit", "Sold"] }
              - { label: "Condition", name: "condition", widget: "select", default: "New", options: ["New", "Used"] }
              - { label: "Show on website", name: "active", widget: "boolean", default: true, hint: "Turn OFF to hide this unit from the site (keeps the record)" }
              - label: "Photos"
                name: "photos"
                widget: "list"
                required: false
                hint: "Open the picker and SELECT ALL your photos at once to upload them together. The first one is the main photo. Drag to reorder."
                field: { label: "Photo", name: "photo", widget: "image" }
              - { label: "Model", name: "model", widget: "string", required: false, hint: "Auto-filled from the VIN plate — usually leave as is" }
              - { label: "Category", name: "category", widget: "select", required: false, default: "trailer", options: ["trailer", "pontoon-trailer", "pontoon"] }
              - { label: "Year", name: "year", widget: "string", required: false }
              - { label: "id", name: "id", widget: "hidden" }
              - { label: "fullName", name: "fullName", widget: "hidden", required: false }
              - { label: "vin", name: "vin", widget: "hidden", required: false }
              - { label: "slug", name: "slug", widget: "hidden", required: false }
              - { label: "tag", name: "tag", widget: "hidden", required: false }
              - { label: "desc", name: "desc", widget: "hidden", required: false }
              - { label: "chips", name: "chips", widget: "hidden", required: false }
              - { label: "specs", name: "specs", widget: "hidden", required: false }
              - { label: "seoTitle", name: "seoTitle", widget: "hidden", required: false }
              - { label: "seoDesc", name: "seoDesc", widget: "hidden", required: false }
 

